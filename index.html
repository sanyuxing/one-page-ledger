<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f5f1" />
  <link rel="manifest" href="manifest.json">
  <title>一页账本</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div>
        <p class="eyebrow">ONE PAGE LEDGER</p>
        <h1 id="todayTitle">今天</h1>
      </div>

      <button class="calendar-btn" id="calendarBtn" aria-label="选择日期">
        <span>日</span>
      </button>
    </header>

    <main class="content">

      <!-- 今日概览 -->
      <section class="hero-card">
        <p>今天花了</p>
        <div class="today-amount">
          <span>¥</span>
          <strong id="todayTotal">0.00</strong>
        </div>

        <div class="hero-bottom">
          <span id="todayCount">0 笔记录</span>
          <span id="monthTotal">本月 ¥0.00</span>
        </div>
      </section>

      <!-- 今日账单 -->
      <section class="records-section">
        <div class="section-header">
          <h2>今天</h2>
          <button id="clearTodayBtn" class="text-btn">清空</button>
        </div>

        <div id="recordList" class="record-list">
          <!-- JS 动态生成 -->
        </div>

        <div id="emptyState" class="empty-state">
          <div class="empty-icon">◌</div>
          <h3>今天还没有记录</h3>
          <p>花了钱，就顺手记一下。</p>
        </div>
      </section>

    </main>

    <!-- 新增按钮 -->
    <button class="add-btn" id="addBtn">
      <span>＋</span>
      <em>记一笔</em>
    </button>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-item active">
        <span>⌂</span>
        <small>今天</small>
      </button>

      <button class="nav-item" id="allRecordsBtn">
        <span>☷</span>
        <small>账单</small>
      </button>

      <button class="nav-item" id="statsBtn">
        <span>◒</span>
        <small>统计</small>
      </button>

      <button class="nav-item" id="settingsBtn">
        <span>⚙</span>
        <small>设置</small>
      </button>
    </nav>

  </div>


  <!-- 新增账单弹窗 -->
  <div class="modal-backdrop" id="modalBackdrop">

    <div class="modal" id="recordModal">

      <div class="modal-handle"></div>

      <div class="modal-header">
        <div>
          <p class="eyebrow">NEW RECORD</p>
          <h2>记一笔</h2>
        </div>

        <button class="close-btn" id="closeModal">×</button>
      </div>

      <!-- 金额 -->
      <div class="amount-input">
        <span>¥</span>
        <input
          id="amountInput"
          type="number"
          inputmode="decimal"
          placeholder="0.00"
          step="0.01"
          min="0"
          autocomplete="off"
        />
      </div>

      <!-- 分类 -->
      <div class="category-title">分类</div>

      <div class="categories">

        <button class="category active" data-category="餐饮">
          <span>🍚</span>
          <small>餐饮</small>
        </button>

        <button class="category" data-category="饮品">
          <span>🧋</span>
          <small>饮品</small>
        </button>

        <button class="category" data-category="交通">
          <span>🚌</span>
          <small>交通</small>
        </button>

        <button class="category" data-category="购物">
          <span>🛍</span>
          <small>购物</small>
        </button>

        <button class="category" data-category="娱乐">
          <span>🎮</span>
          <small>娱乐</small>
        </button>

        <button class="category" data-category="学习">
          <span>📚</span>
          <small>学习</small>
        </button>

        <button class="category" data-category="生活">
          <span>🏠</span>
          <small>生活</small>
        </button>

        <button class="category" data-category="其他">
          <span>···</span>
          <small>其他</small>
        </button>

      </div>

      <!-- 备注 -->
      <div class="note-wrapper">
        <label for="noteInput">备注</label>
        <input
          id="noteInput"
          type="text"
          placeholder="例如：鲜奶茉莉奶绿"
          maxlength="40"
        />
      </div>

      <button class="save-btn" id="saveBtn">
        保存
      </button>

    </div>
  </div>


  <!-- 提示 -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
